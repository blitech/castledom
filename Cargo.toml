[workspace]
resolver = "2"
members = [
    "game_core",
    "game_render",
    "game_net",
    "game_app",
    "signaling",
]
default-members = ["game_app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Castledom — hybrid RTS (Castle Wars × Domination Wars)"

[workspace.dependencies]
game_core = { path = "game_core" }
game_render = { path = "game_render" }
game_net = { path = "game_net" }
bevy = { version = "0.18.1", default-features = false, features = ["2d"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
bytemuck = { version = "1", features = ["derive"] }
